name: Bump TextPicker

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bump-textpicker
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Update the cask to the latest published release
        env:
          GH_TOKEN: ${{ github.token }}
          CASK: Casks/textpicker.rb
          ASSET: TextPicker-arm64.zip
        run: |
          set -euo pipefail
          tag=$(gh release view --repo georgiansarghi/TextPicker --json tagName -q .tagName)
          version=${tag#v}
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Unexpected tag: $tag" >&2; exit 1; }
          current=$(sed -nE 's/^  version "(.*)"$/\1/p' "$CASK")
          if [ "$version" = "$current" ]; then
            echo "Already at $version."
            exit 0
          fi

          work=$(mktemp -d)
          gh release download "$tag" --repo georgiansarghi/TextPicker \
            -p "$ASSET" -p SHA256SUMS.txt -D "$work"
          (cd "$work" && sha256sum --check --strict --ignore-missing SHA256SUMS.txt)
          sha=$(awk -v f="$ASSET" '$2 == f { print $1 }' "$work/SHA256SUMS.txt")
          [[ "$sha" =~ ^[0-9a-f]{64}$ ]] || { echo "No checksum for $ASSET" >&2; exit 1; }

          sed -i -E \
            -e "s/^  version \".*\"$/  version \"$version\"/" \
            -e "s/^  sha256 \".*\"$/  sha256 \"$sha\"/" "$CASK"
          git diff --exit-code --quiet "$CASK" && { echo "Cask did not change" >&2; exit 1; }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(textpicker): update to $version" -- "$CASK"
          git push
