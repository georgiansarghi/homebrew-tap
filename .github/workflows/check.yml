name: Check casks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tap this checkout
        run: |
          tap="$(brew --repository)/Library/Taps/georgiansarghi/homebrew-tap"
          mkdir -p "$(dirname "$tap")"
          ln -s "$GITHUB_WORKSPACE" "$tap"
          brew trust georgiansarghi/tap
      - run: brew style georgiansarghi/tap
      - run: brew audit --cask --strict --online georgiansarghi/tap/textpicker
